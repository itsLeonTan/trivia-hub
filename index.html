<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="src/trivia.png">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/index.css">
    <script src="js/main.js" defer></script>

    <title>TriviaHub</title>
</head>

<body>
    <main>
        <a id="rubik" href="https://itsleontan.com">
            <img src="src/rubik.png" alt="Rubik's Cube">
        </a>

        <p id="above-title">A LITTLE KNOWLEDGE GOES A LONG WAY</p>
        <h1 id="game-title">TriviaHub</h1>
        <p id="below-title">Pick your challenge and put your knowledge to the test.</p>

        <section id="settings">
            <div class="setting-group">
                <label for="difficulty">Difficulty</label>
                <select id="difficulty">
                    <option value="easy">Easy</option>
                    <option value="medium">Medium</option>
                    <option value="hard">Hard</option>
                </select>
            </div>

            <div class="setting-group">
                <label for="genre">Genre</label>
                <select id="genre">
                </select>
            </div>
        </section>

        <button id="start-button">Start Game</button>

        <div id="info-container">
            <div>?</div>
            <div>
                <p>Where do the questions come from?</p>
                <p>Trivia questions are provided by <a id="source" href="https://opentdb.com" target="_blank">Open Trivia Database (OpenTDB) &nearr;</a>, a free, community-contributed trivia API.</p>
            </div>
        </div>
    </main>
</body>
</html>
